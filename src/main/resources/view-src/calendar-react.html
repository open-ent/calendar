<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{#i18n}}calendar.title{{/i18n}}</title>
    <link rel="icon" id="favicon" href="" />
    <!-- Bootstrap openent partagé, chargé au runtime : le module suit le thème de
         l'établissement sans recompilation (cf. frontend/index.html). -->
    <link rel="stylesheet" href="/assets/themes/openent-bootstrap/index.css" />
    <!-- `@@VERSION` est remplacé par un horodatage au build (build.sh / CI), comme dans
         calendar.html : le bundle porte un nom fixe, sans quoi les navigateurs resserviraient
         indéfiniment l'ancien JS après un déploiement. -->
    <script type="module" crossorigin src="/calendar/public/index.js?v=@@VERSION"></script>
    <link rel="stylesheet" crossorigin href="/calendar/public/index.css?v=@@VERSION">
  </head>
  <body class="app-react" data-ode-app>
    <div id="root"></div>
    <div id="portal"></div>
  </body>
</html>
