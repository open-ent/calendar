<div class="row">
    <form name="form">
        <h2>
            <i18n ng-if="!calendar._id">calendar.new</i18n>
            <i18n ng-if="calendar._id">calendar.edit</i18n>
        </h2>

        <div class="row">
            <label class="twelve cell"><i18n>calendar.title</i18n> *</label>
            <input class="twelve cell" required ng-model="calendar.title" type="text"/>
        </div>

        <!-- Type d'agenda (création uniquement) : options affichées selon les droits workflow -->
        <div class="row" ng-if="!calendar._id && (canCreateStructureCalendar() || canCreateGroupCalendar())">
            <label class="twelve cell"><i18n>calendar.type</i18n></label>
            <label class="radio-inline">
                <input type="radio" ng-model="calendar.type" value="personal" ng-change="onChangeCalendarType()"/>
                <i18n>calendar.type.personal</i18n>
            </label>
            <label class="radio-inline" ng-if="canCreateStructureCalendar()">
                <input type="radio" ng-model="calendar.type" value="structure" ng-change="onChangeCalendarType()"/>
                <i18n>calendar.type.structure</i18n>
            </label>
            <label class="radio-inline" ng-if="canCreateGroupCalendar()">
                <input type="radio" ng-model="calendar.type" value="group" ng-change="onChangeCalendarType()"/>
                <i18n>calendar.type.group</i18n>
            </label>
        </div>
        <div class="row message info" ng-if="!calendar._id && (calendar.type === 'structure' || calendar.type === 'group')">
            <i18n>calendar.type.share.hint</i18n>
        </div>

        <div class="row">
            <label class="twelve cell"><i18n>calendar.color</i18n></label>
            <color-selector ng-model='calendar.color'></color-selector>
        </div>

        <button class="right-magnet" ng-disabled="form.$invalid" ng-click="saveCalendarEdit(calendar)"><i18n>save</i18n></button>
        <button class="cancel right-magnet" ng-click="cancelCalendarEdit()"><i18n>cancel</i18n></button>
    </form>
</div>
