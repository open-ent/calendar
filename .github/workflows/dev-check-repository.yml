name: dev-check-repository

on:
  push:
  workflow_dispatch:

jobs:
  build-node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        id: pnpm-install
        with:
          run_install: false

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build
